query BluegrassArtistLifetimeSales {
  artistAggregations(
    filter: {genres: {anySatisfy: {equalToAnyOf: [BLUEGRASS]}}}
  ) {
    nodes {
      groupedBy {
        bio { yearFormed }
      }

      aggregatedValues {
        lifetimeSales {
          exactMin
          exactMax

          exactSum
          approximateSum

          approximateAvg

          median: approximatePercentile(percentile: 50)
          p90: approximatePercentile(percentile: 90)
        }
      }
    }
  }
}
