query VenueCountsByGeoTile {
  venueAggregations {
    nodes {
      count
      groupedBy {
        location {
          asGeoTile(zoomLevel: 8) {
            zoomLevel
            x
            y
            centerPoint {
              latitude
              longitude
            }
            bounds {
              north
              south
              east
              west
            }
            corners {
              northWest { latitude longitude }
              northEast { latitude longitude }
              southWest { latitude longitude }
              southEast { latitude longitude }
            }
          }
        }
      }
    }
  }
}
