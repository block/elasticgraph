// Minimal external type for the custom scalar mapping spec. The schema helper
// supplies this fixture to protoc so the generated myapp.types.Money reference can
// compile. The hyphenated directory and dotted filename exercise valid import paths
// that do not simply mirror the protobuf package name.

syntax = "proto3";
package myapp.types;

message Money {}
