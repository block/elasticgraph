// Minimal external type for the spec that imports only referenced scalar types.
// The schema helper supplies this fixture to protoc so example.UsedType can compile.
// The unused.proto and graphql_only_field.proto paths deliberately have no fixtures:
// those imports must be absent because generated messages do not reference them.

syntax = "proto3";
package example;

message UsedType {}
