// Minimal external types for the scalar import specs. The schema helper supplies
// this fixture to protoc so both generated type references can compile.
// Two scalars import this file to test import deduplication. Its z/ path sorts
// after a/types.proto even though these scalars are defined first in the spec.

syntax = "proto3";
package example;

message FirstZType {}
message SecondZType {}
